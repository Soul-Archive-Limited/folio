# XcodeGen spec — the .xcodeproj is generated from this file and git-ignored (SPEC §0.9).
# Regenerate after any change:  cd ios && xcodegen generate
name: Folio

options:
  bundleIdPrefix: com.devilsense
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team ID (10 characters, not secret). Set before running on a real
    # device or using capabilities like Sign in with Apple — see README "Signing".
    DEVELOPMENT_TEAM: ""

targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - path: Folio
        excludes: ["**/.gitkeep"]
    entitlements:
      path: Folio/Resources/Folio.entitlements
    info:
      path: Folio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Folio
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Folio uses the camera only when you choose to take a photo for an entry."
        UILaunchScreen:
          UIColorName: bg
          UIImageName: AppMark
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio
        PRODUCT_NAME: Folio
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: FolioCrypto
        embed: false
    scheme:
      testTargets:
        - FolioTests
        - FolioCryptoTests
        - FolioUITests

  FolioCrypto:
    type: framework
    platform: iOS
    sources:
      - path: FolioCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.crypto
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
        # Library code: callers decide where it runs (write-swift §3).
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FolioCryptoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FolioCryptoTests
      - path: ../shared/crypto-vectors.json
        buildPhase: resources
    dependencies:
      - target: FolioCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.crypto.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FolioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FolioUITests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Folio
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FolioTests
      - path: ../shared/markdown-fixtures.json
        buildPhase: resources
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.tests
        GENERATE_INFOPLIST_FILE: YES
