# XcodeGen spec — the .xcodeproj is generated from this file and git-ignored (SPEC §0.9).
# Regenerate after any change:  cd ios && xcodegen generate
name: Folio

options:
  bundleIdPrefix: com.devilsense
  deploymentTarget:
    iOS: "26.0"
  # Matches the Xcode in use, so Xcode doesn't flag "Update to recommended settings" (Batch E).
  xcodeVersion: "27.1"
  createIntermediateGroups: true
  groupSortPosition: top
  # Build number: CI_BUILD_NUMBER on Xcode Cloud, git commit count locally (Batch D).
  preGenCommand: ../scripts/write-build-number.sh

configFiles:
  Debug: Config/BuildNumber.xcconfig
  Release: Config/BuildNumber.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Xcode 27.1's recommended project settings (its Base_ProjectSettings template).
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    MARKETING_VERSION: "0.1.0"
    # CURRENT_PROJECT_VERSION comes from Config/BuildNumber.xcconfig (generated, git-ignored).
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team ID (10 characters, not secret): Soul Archive Ltd. Needed for real
    # devices and capabilities like Sign in with Apple — see README "Signing".
    DEVELOPMENT_TEAM: "25DH3LUCPC"

targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - path: Folio
        excludes: ["**/.gitkeep"]
    entitlements:
      path: Folio/Resources/Folio.entitlements
    info:
      path: Folio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only Apple's CryptoKit and HTTPS: encryption within the operating system, exempt from
        # export documentation (DECISIONS 143). Never add a third-party crypto library.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Folio uses the camera only when you choose to take a photo for an entry."
        NSMicrophoneUsageDescription: "Folio uses the microphone only while you dictate. Audio is processed on your iPhone and never stored or sent anywhere."
        NSSpeechRecognitionUsageDescription: "Folio turns your voice into text on your iPhone. Nothing is sent to a server."
        # Background refresh runs the Recently Deleted purge (SPEC §5.2) and, from Phase 10, sync.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.devilsense.folio.refresh]
        UILaunchScreen:
          UIColorName: bg
          UIImageName: AppMark
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio
        PRODUCT_NAME: Folio
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
    dependencies:
      - target: FolioCrypto
        embed: false
    scheme:
      testTargets:
        - FolioTests
        - FolioCryptoTests
        - FolioUITests

  FolioCrypto:
    type: framework
    platform: iOS
    sources:
      - path: FolioCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.crypto
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
        ENABLE_MODULE_VERIFIER: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGES: "objective-c objective-c++"
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu17 gnu++20"
        # Library code: callers decide where it runs (write-swift §3).
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FolioCryptoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FolioCryptoTests
      - path: ../shared/crypto-vectors.json
        buildPhase: resources
    dependencies:
      - target: FolioCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.crypto.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FolioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FolioUITests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        TEST_TARGET_NAME: Folio
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  FolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FolioTests
      - path: ../shared/markdown-fixtures.json
        buildPhase: resources
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devilsense.folio.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO
