name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test (simulator, unsigned)
        run: |
          set -o pipefail
          DEST_ID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Folio.xcodeproj -scheme Folio \
            -destination "id=$DEST_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Release for iOS devices (what Archive builds, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Folio.xcodeproj -scheme Folio -configuration Release \
            -destination "generic/platform=iOS" \
            -resultBundlePath build/release.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: No warnings in the Release build
        run: ../scripts/check-warnings.sh build/release.xcresult
